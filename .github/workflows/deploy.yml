name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Same strategy as branch-pipeline.yml, and the same two reusable workflows:
  # check-fast is the cheap gate in front of everything that costs Cloudflare,
  # and check-slow runs beside the expensive jobs instead of in front of them.
  # deploy.yml adds terraform + deploy-prod and gates on no draft state, because a
  # push to main always runs. Re-running both checks and both E2E halves here BEFORE
  # deploying is what makes a branch's stale green safe to merge on.
  check-fast:
    uses: ./.github/workflows/check-fast.yml

  check-slow:
    needs: check-fast
    uses: ./.github/workflows/check-slow.yml

  terraform:
    needs: check-fast
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      d1_database_id_prod: ${{ steps.tf_outputs.outputs.d1_database_id_prod }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14"
          terraform_wrapper: false
      - name: Terraform init in R2
        run: |
          terraform -chdir=iac init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"
      - name: Terraform apply
        run: terraform -chdir=iac apply -input=false -auto-approve
      - id: tf_outputs
        name: Read D1 ID
        run: echo "d1_database_id_prod=$(terraform -chdir=iac output -raw d1_database_id_prod)" >> "$GITHUB_OUTPUT"

  # Two jobs in parallel, each with its own isolated Worker and D1 — same as
  # branch-pipeline.yml, same reusable workflow, same projects.
  ephemeral-e2e-event:
    needs: check-fast
    uses: ./.github/workflows/ephemeral-e2e.yml
    with:
      project: event
    secrets: inherit

  ephemeral-e2e-town:
    needs: check-fast
    uses: ./.github/workflows/ephemeral-e2e.yml
    with:
      project: town
    secrets: inherit

  # EVERY gate above must be in `needs` AND in the condition. `always()` is what
  # lets this job see a skipped dependency at all, so a gate missing from either
  # list is a gate that silently stops guarding production.
  deploy-prod:
    needs:
      [
        check-fast,
        check-slow,
        terraform,
        ephemeral-e2e-event,
        ephemeral-e2e-town,
      ]
    if: >-
      always() &&
      needs.check-fast.result == 'success' &&
      needs.check-slow.result == 'success' &&
      needs.terraform.result == 'success' &&
      needs.ephemeral-e2e-event.result == 'success' &&
      needs.ephemeral-e2e-town.result == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIG: dist/ignis_snaps/wrangler.production.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and prepare production config
        run: |
          CLOUDFLARE_ENV=production pnpm build
          node scripts/prepare-production-config.mjs "${{ needs.terraform.outputs.d1_database_id_prod }}" "$CONFIG"
      # $CONFIG is already the production environment resolved and flattened by
      # the CLOUDFLARE_ENV=production build: worker name "ignis-snaps", no
      # `env.production` block left inside it. So NOTHING below may pass
      # `--env production` — wrangler would fall back to legacy env naming and
      # act on a phantom "ignis-snaps-production" worker instead (which is how
      # JWT_SECRET went missing from the real one and every login 500'd).
      #
      # BEFORE the migrations, and it is the only place it can go: migration 0014
      # drops the base64 columns this reads, and a D1 migration cannot write to R2
      # itself. It is re-runnable — the backfill derives its keys from the rows, so
      # a second pass overwrites rather than duplicates — and it says out loud when
      # it finds the columns already gone rather than reporting a silent nothing.
      - name: Backfill image bytes into R2
        run: node scripts/backfill-images.mjs --config "$CONFIG"
      - name: Apply production D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote -c "$CONFIG"
      - name: Deploy production Worker
        run: pnpm exec wrangler deploy -c "$CONFIG"
      - name: Set production secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
        run: |
          printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put JWT_SECRET -c "$CONFIG"
          printf '%s' "$USERS_JSON" | pnpm exec wrangler secret put USERS_JSON -c "$CONFIG"
          # Optional: `wrangler secret put` rejects an empty value, and a repo
          # without the key deploys fine — every AI evaluation just takes its
          # failure path instead.
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | pnpm exec wrangler secret put GEMINI_API_KEY -c "$CONFIG"
          else
            echo "GEMINI_API_KEY is not set — deploying without it; the AI jury will score every photo through its failure path."
          fi
          if [ -n "$GEMINI_API_KEY_PAID" ]; then
            printf '%s' "$GEMINI_API_KEY_PAID" | pnpm exec wrangler secret put GEMINI_API_KEY_PAID -c "$CONFIG"
          else
            echo "GEMINI_API_KEY_PAID is not set — deploying without it; the avatar machine will answer offline and charge nothing."
          fi
      - name: Seed the friends group into production D1
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: node scripts/seed.mjs --remote --config "$CONFIG"
