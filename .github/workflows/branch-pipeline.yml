name: Branch pipeline

# Checks + a full ephemeral E2E; never deploys to production.
#
# PULL REQUESTS ONLY. A `pull_request` event builds `refs/pull/N/merge` — head ALREADY
# MERGED into current `main` — so being behind `main` costs nothing. No `push` trigger:
# a branch commit is not a thing anyone merges, and running the suite on one bought a
# second run per sha that only confused `ship` about which one carried the `gate`.
# Drafts run nothing, so pushing to one is free. Re-run a head by re-running the RUN
# (`gh run rerun`), never by flipping the PR back to draft — that races its own event.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: branch-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-fast:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/check-fast.yml

  check-slow:
    needs: check-fast
    uses: ./.github/workflows/check-slow.yml

  # Two jobs, in parallel, each with its own isolated Worker and D1. Splitting
  # the suite by Playwright project is what halves the wall clock; splitting the
  # DEPLOYMENT with it is what keeps the halves from resetting each other's
  # world. See playwright.config.ts for how the files are divided.
  ephemeral-e2e-event:
    needs: check-fast
    uses: ./.github/workflows/ephemeral-e2e.yml
    with:
      project: event
    secrets: inherit

  ephemeral-e2e-town:
    needs: check-fast
    uses: ./.github/workflows/ephemeral-e2e.yml
    with:
      project: town
    secrets: inherit

  gate:
    needs: [check-fast, check-slow, ephemeral-e2e-event, ephemeral-e2e-town]
    # SKIPPED on a draft, so "gate succeeded" is the one fact `ship` has to establish.
    # The run's own conclusion cannot carry it: a run whose jobs all skipped concludes
    # `success` and must keep doing so, or every draft shows red.
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Every gate must have passed
        env:
          RESULTS: >-
            check-fast=${{ needs.check-fast.result }}
            check-slow=${{ needs.check-slow.result }}
            e2e-event=${{ needs.ephemeral-e2e-event.result }}
            e2e-town=${{ needs.ephemeral-e2e-town.result }}
        run: |
          echo "$RESULTS"
          for pair in $RESULTS; do
            if [ "${pair#*=}" != "success" ]; then
              echo "A pipeline job did not succeed: $pair"
              exit 1
            fi
          done
          echo "check-fast, check-slow and both e2e projects all succeeded."
